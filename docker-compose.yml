# Local development stack:  docker compose up --build
# App:  http://localhost:8080      API:  http://localhost:5000/api/health
services:

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/mern_cicd
      APP_VERSION: local
    ports: ["5006:5000"]
    depends_on:
      mongo: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8085:80"]
    volumes:
      # proxy /api to the backend container (on AWS the ALB does this instead)
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]

volumes:
  mongo-data:
